modules:
  jira:issuePanel:
    - key: trace-panel
      resource: panel
      resolver:
        function: panel-resolver
      render: native
      title: Trace
      icon: resource:icons;trace.svg
  jira:adminPage:
    - key: traceline-admin
      resource: admin
      resolver:
        function: admin-resolver
      render: native
      title: Traceline
      useAsGetStarted: true
  jira:globalPage:
    - key: traceline-home
      resource: cockpit
      resolver:
        function: admin-resolver
      title: Traceline
      icon: resource:icons;trace.svg
      layout: native
  confluence:spacePage:
    - key: traceability-matrix-page
      resource: matrix
      resolver:
        function: matrix-resolver
      title: Traceability matrix
      route: traceability
  jira:workflowValidator:
    - key: passing-verification-validator
      name: Requires passing verification (Traceline)
      description: Blocks the transition when the issue implements a requirement at a
        guarded safety level that has no verification passing against its
        current version.
      function: validate-done
  action:
    - key: gaps-for-release
      name: Gaps for a release
      function: act-gaps-for-release
      actionVerb: GET
      description: Lists the blocking gaps and warnings for a release (fix version) and answers whether it can ship under the active standard pack.
      inputs:
        release:
          title: Release
          type: string
          required: false
          description: Release or fix version name, for example v2.3. Omit for the whole project.
    - key: impact-of-change
      name: Impact of a change
      function: act-impact-of-change
      actionVerb: GET
      description: Lists every artifact downstream of a requirement, hazard, risk control, design item or issue, and the verifications that must be re-run if it changes.
      inputs:
        artifactKey:
          title: Artifact key
          type: string
          required: true
          description: Jira issue key such as PUMP-4, or a reference such as SRS-004.
    - key: what-to-retest
      name: What to re-test
      function: act-what-to-retest
      actionVerb: GET
      description: Lists the tests that must be re-run if the given issue or requirement changes.
      inputs:
        artifactKey:
          title: Artifact key
          type: string
          required: true
          description: Jira issue key such as PUMP-4.
    - key: trace-chain
      name: Trace chain
      function: act-trace-chain
      actionVerb: GET
      description: Shows the upstream and downstream trace chain for one artifact, with plain-text statuses and why any link is suspect.
      inputs:
        artifactKey:
          title: Artifact key
          type: string
          required: true
          description: Jira issue key such as PUMP-4, or a reference such as SRS-004.
    - key: coverage-by-clause
      name: Coverage by clause
      function: act-coverage-by-clause
      actionVerb: GET
      description: Reports how many traceability checks pass under each clause of a standard pack.
      inputs:
        standard:
          title: Standard
          type: string
          required: false
          description: iec62304, iso26262 or do178c. Omit for the configured pack.
    - key: draft-impact-analysis
      name: Draft impact analysis
      function: act-draft-impact
      actionVerb: GET
      description: Returns structured facts (affected items, hazards, tests to repeat, safety level) for writing a change impact analysis for one artifact.
      inputs:
        artifactKey:
          title: Artifact key
          type: string
          required: true
          description: Jira issue key such as PUMP-4.
    - key: mock-audit
      name: Mock audit
      function: act-mock-audit
      actionVerb: GET
      description: Generates the questions an auditor is likely to ask from the current gaps and suspect links, with the evidence that would answer each.
      inputs:
        scope:
          title: Scope
          type: string
          required: false
          description: Release name such as v2.3. Omit for the whole project.
    - key: trace-for-file
      name: Trace for a file
      function: act-trace-for-file
      actionVerb: GET
      description: Lists the requirements and risk controls implemented by a code file, folder or component, via linked implementation work.
      inputs:
        path:
          title: Path or component
          type: string
          required: true
          description: File path, folder or component name, for example src/occlusion-monitor/.
  rovo:skill:
    - key: traceline-auditor-skill
      source:
        dir: skills/traceline-auditor
      dependencies:
        tools:
          - gaps-for-release
          - impact-of-change
          - what-to-retest
          - trace-chain
          - coverage-by-clause
          - draft-impact-analysis
          - mock-audit
          - trace-for-file
  rovo:agent:
    - key: traceline-auditor
      name: Traceline Auditor
      description: A calm, precise regulatory assistant that answers audit and change-impact questions from your live trace graph, citing artifact keys and clauses.
      prompt: resource:prompts;auditor.md
      conversationStarters:
        - Can we ship v2.3?
        - What must be re-tested if PUMP-4 changes?
        - Run a mock audit for v2.3
        - How is our IEC 62304 clause coverage?
      actions:
        - gaps-for-release
        - impact-of-change
        - what-to-retest
        - trace-chain
        - coverage-by-clause
        - draft-impact-analysis
        - mock-audit
        - trace-for-file
  rovo:mcp:
    - key: traceline-mcp
      name: Traceline
      tools:
        - trace-for-file
        - impact-of-change
        - gaps-for-release
        - what-to-retest
        - trace-chain
        - coverage-by-clause
  trigger:
    - key: issue-events
      function: on-issue
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:deleted:issue
      filter:
        ignoreSelf: true
    - key: link-events
      function: on-link
      events:
        - avi:jira:created:issuelink
        - avi:jira:deleted:issuelink
      filter:
        ignoreSelf: true
    - key: page-events
      function: on-page
      events:
        - avi:confluence:created:page
        - avi:confluence:updated:page
    - key: lifecycle-events
      function: on-lifecycle
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
  scheduledTrigger:
    - key: nightly-recompute
      function: nightly
      interval: day
  consumer:
    - key: jobs-consumer
      queue: traceline-jobs
      function: run-job
  sql:
    - key: main
      engine: mysql
  function:
    - key: act-gaps-for-release
      handler: index.gapsForRelease
    - key: act-impact-of-change
      handler: index.impactOfChangeAction
    - key: act-what-to-retest
      handler: index.whatToRetest
    - key: act-trace-chain
      handler: index.traceChainAction
    - key: act-coverage-by-clause
      handler: index.coverageByClause
    - key: act-draft-impact
      handler: index.draftImpactAnalysis
    - key: act-mock-audit
      handler: index.mockAuditAction
    - key: act-trace-for-file
      handler: index.traceForFile
    - key: panel-resolver
      handler: index.panelHandler
    - key: admin-resolver
      handler: index.adminHandler
    - key: matrix-resolver
      handler: index.matrixHandler
    - key: validate-done
      handler: index.validateDone
    - key: on-issue
      handler: index.onIssueEvent
    - key: on-link
      handler: index.onLinkEvent
    - key: on-page
      handler: index.onPageEvent
    - key: on-lifecycle
      handler: index.onLifecycle
    - key: nightly
      handler: index.nightly
    - key: run-job
      handler: index.runJob
      timeoutSeconds: 900
resources:
  - key: panel
    path: src/frontend/panel.tsx
  - key: admin
    path: src/frontend/admin.tsx
  - key: icons
    path: static/icons
  - key: prompts
    path: static/prompts
  - key: cockpit
    path: static/cockpit/build
  - key: matrix
    path: static/matrix/build
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-configuration
    - manage:jira-project
    - read:confluence-content.summary
    - read:confluence-content.all
    - write:confluence-content
    - read:confluence-space.summary
    - write:confluence-space
    - search:confluence
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
    - read:label:confluence
app:
  id: ari:cloud:ecosystem::app/93b72ef4-1337-46ac-b78e-3cbad7877ede
  runtime:
    name: nodejs24.x
